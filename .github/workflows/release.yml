name: Release

# Build + gate + publish the install zip whenever a version tag is pushed.
#   git tag v1.0.0 && git push origin v1 --tags
# produces a GitHub Release with a verified wp-mcp.zip attached. See docs/RELEASE.md.
#
# The tests run HERE, in this workflow, rather than being read off ci.yml: ci.yml is
# triggered by push/pull_request on main and does not run on a tag push, so there is
# no run to depend on. The two test jobs below are copies of ci.yml's, and `release`
# has `needs: [lint, phpunit-unit, integration]` - a red test makes publishing
# impossible, not merely inadvisable.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the release

jobs:
  lint:
    name: PHP lint (8.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: php -l all plugin files
        run: |
          status=0
          for f in wp-mcp.php endpoint.php admin.php tools.php trace.php uninstall.php src/*.php; do
            echo "::group::php -l $f"
            php -l "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Guard - the parse check and the version-first rule are still wired in
        # TWO MARKERS, because the tools make two promises and one count cannot hold
        # both. The first WAS a count of the old backup-path helper, gone with the
        # sibling files it guarded (schema revision 4 - the version table); its subject
        # was never those files but the AUTO-REVERT, which they used to be half of.
        #
        #   wpmcp_php_parse_ok       x3  definition, code-write, code-restore
        #   wpmcp_code_version_current x4  definition, code-write, code-delete,
        #                                code-restore
        #
        # The second is the sprint-8 review's correction: the old guard's third site was
        # code-delete, which the parse-check count does not reach (it deletes rather than
        # writing PHP), so nothing was left guarding "every mutation versions first" -
        # the promise the whole version table exists to keep. A new writer or deleter
        # added without one of the two makes this red, which is the point.
        run: |
          parse=$(grep -c "wpmcp_php_parse_ok" tools.php)
          echo "wpmcp_php_parse_ok occurrences: $parse (expected 3)"
          test "$parse" -eq 3

          versioned=$(grep -c "wpmcp_code_version_current" tools.php)
          echo "wpmcp_code_version_current occurrences: $versioned (expected 4)"
          test "$versioned" -eq 4

  phpunit-unit:
    name: PHPUnit unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Unit suite
        run: composer test:unit

  integration:
    name: PHPUnit integration (wp-env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Set up Node (for @wordpress/env)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Start WordPress (Docker, plugin mapped in and activated)
        run: npx --yes @wordpress/env start --debug

      - name: Enable pretty permalinks
        run: npx --yes @wordpress/env run cli wp rewrite structure '/%postname%/' --hard

      - name: Integration suite
        env:
          WPMCP_TEST_URL: http://localhost:8888
          # Without this the fixture harness cannot reach WordPress inside the container,
          # every fixture-bearing test skips, and a skip is green. ci.yml learned this in
          # 8db2a74; release.yml had not.
          WPMCP_WP_ENV: '1'
        run: composer test:integration

      - name: Sprint gates actually executed (a skipped gate is not a gate)
        env:
          WPMCP_TEST_URL: http://localhost:8888
          WPMCP_WP_ENV: '1'
        # Same check as ci.yml, and it has to be here too: ci.yml does not run on a tag
        # push, so this workflow is the only thing standing between a red gate and a
        # published release. Keep the two lists in step. sprint-9 was added in Sprint 9,
        # sprint-10 in Sprint 10, sprint-11 in Sprint 11, sprint-12 in Sprint 12 and sprint-13 in Sprint 13, each on the day its gate
        # closed.
        run: |
          status=0
          for group in sprint-0 sprint-1 sprint-2 sprint-3 sprint-4 sprint-5 sprint-6 sprint-7 sprint-8 sprint-9 sprint-10 sprint-11 sprint-12 sprint-13; do
            echo "::group::$group"
            log="junit-$group.xml"
            rm -f "$log"
            vendor/bin/phpunit --group "$group" --log-junit "$log" || status=1
            if [ ! -f "$log" ]; then
              echo "::error::$group produced no JUnit log."
              status=1
              echo "::endgroup::"
              continue
            fi
            cases=$(grep -c '<testcase ' "$log" || true)
            empty=$(grep -o '<testsuite name="WpMcp[^>]*' "$log" | grep -cv 'tests="[1-9]' || true)
            skipped=$(grep -c '<skipped' "$log" || true)
            echo "$group: testcases=$cases classes-that-ran-nothing=$empty skipped-tests=$skipped"
            if [ "$cases" -eq 0 ] || [ "$empty" -ne 0 ] || [ "$skipped" -ne 0 ]; then
              echo "::error::$group did not execute every one of its tests. A gate that skips is not a gate."
              status=1
            fi
            rm -f "$log"
            echo "::endgroup::"
          done
          exit $status

      - name: WordPress logs (on failure)
        if: failure()
        # `logs` FOLLOWS the logs by default (--watch defaults to true in @wordpress/env 11.15),
        # so without --watch=false this step never exits: a failed run once sat here for over
        # two hours until it was cancelled. The timeout is the backstop.
        timeout-minutes: 5
        run: npx --yes @wordpress/env logs all --watch=false || true

      - name: Stop WordPress
        if: always()
        run: npx --yes @wordpress/env stop || true

  release:
    name: Build, gate, and release
    runs-on: ubuntu-latest
    # The release must be impossible while the suite is red. All three must be
    # green; `needs` treats any failure or cancellation as a blocker, and the whole
    # matrix of phpunit-unit has to pass, not just one leg.
    needs: [lint, phpunit-unit, integration]
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint all plugin files
        run: |
          for f in wp-mcp.php endpoint.php admin.php tools.php trace.php uninstall.php src/*.php; do
            php -l "$f"
          done

      - name: Stage the install set under wp-mcp/
        # THE WHOLE RUNTIME, and it is longer than it was: trace.php, uninstall.php and
        # src/ arrived after this step was written, and a zip without them installs a
        # plugin that fatals on its first request. The gate below compares the extracted
        # copy against this list, so anything missing here is missing silently.
        #
        # The documentation ships too, all of it, because README.md links to SECURITY.md,
        # ARCHITECTURE.md, CHANGELOG.md, BUILD-NOTES.md and four files under docs/. A zip
        # carrying only README.md gives a reader six dead links.
        #
        # `cp src/*.php` is flat on purpose, and correct today: both classes sit directly
        # in src/. The autoloader maps WpMcp\A\B to src/A/B.php, so the first nested
        # namespace needs this to become `cp -r src dist/wp-mcp/` and the gate's file list
        # to become a find. There is no nested class to justify that yet.
        run: |
          mkdir -p dist/wp-mcp/src dist/wp-mcp/docs
          cp wp-mcp.php endpoint.php admin.php tools.php trace.php uninstall.php dist/wp-mcp/
          cp LICENSE README.md CHANGELOG.md SECURITY.md ARCHITECTURE.md BUILD-NOTES.md dist/wp-mcp/
          cp src/*.php dist/wp-mcp/src/
          cp docs/*.md dist/wp-mcp/docs/

      - name: Build wp-mcp.zip (top-level wp-mcp/ folder)
        run: |
          cd dist
          zip -r wp-mcp.zip wp-mcp -x '*.bak' '*.log'
          cd ..

      - name: GATE - extracted content matches source, lints clean, both guards wired
        run: |
          mkdir -p verify
          unzip -q dist/wp-mcp.zip -d verify
          fail=0
          files="wp-mcp.php endpoint.php admin.php tools.php trace.php uninstall.php"
          files="$files LICENSE README.md CHANGELOG.md SECURITY.md ARCHITECTURE.md"
          files="$files BUILD-NOTES.md $(ls src/*.php) $(ls docs/*.md)"
          for f in $files; do
            if ! cmp -s "$f" "verify/wp-mcp/$f"; then
              echo "MISMATCH: $f differs from the zipped copy"; fail=1
            fi
          done
          # Every PHP file the plugin loads at runtime is in the zip and parses there.
          for f in wp-mcp.php endpoint.php admin.php tools.php trace.php uninstall.php $(ls src/*.php); do
            php -l "verify/wp-mcp/$f" || fail=1
          done
          # The same two markers the lint job guards, asserted on the EXTRACTED copy:
          # the question here is whether what is about to be published is what was
          # tested.
          parse=$(grep -c "wpmcp_php_parse_ok" verify/wp-mcp/tools.php)
          echo "wpmcp_php_parse_ok in zip: $parse (expected 3)"
          test "$parse" -eq 3 || fail=1
          versioned=$(grep -c "wpmcp_code_version_current" verify/wp-mcp/tools.php)
          echo "wpmcp_code_version_current in zip: $versioned (expected 4)"
          test "$versioned" -eq 4 || fail=1
          if [ "$fail" -ne 0 ]; then echo "GATE FAILED - not releasing"; exit 1; fi
          echo "GATE PASSED"

      - name: Create GitHub Release with the verified zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/wp-mcp.zip \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated release of ${GITHUB_REF_NAME}. Self-hosted WordPress MCP server with short-lived, admin-minted, hashed-at-rest tokens; read/admin scopes; opt-in jailed theme code editing. See CHANGELOG.md." \
            --verify-tag
