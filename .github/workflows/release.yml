name: Release

# Build + gate + publish the install zip whenever a version tag is pushed.
#   git tag v0.3.4 && git push origin v0.3.4
# produces a GitHub Release with a verified wp-mcp.zip attached.
#
# The tests run HERE, in this workflow, rather than being read off ci.yml: ci.yml is
# triggered by push/pull_request on main and does not run on a tag push, so there is
# no run to depend on. The two test jobs below are copies of ci.yml's, and `release`
# has `needs: [lint, phpunit-unit, integration]` - a red test makes publishing
# impossible, not merely inadvisable.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the release

jobs:
  lint:
    name: PHP lint (8.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: php -l all plugin files
        run: |
          status=0
          for f in wp-mcp.php endpoint.php admin.php tools.php; do
            echo "::group::php -l $f"
            php -l "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Guard - tools.php auto-revert check is present (wpmcp_bak_ok x3)
        run: |
          count=$(grep -c "wpmcp_bak_ok" tools.php)
          echo "wpmcp_bak_ok occurrences: $count (expected 3)"
          test "$count" -eq 3

  phpunit-unit:
    name: PHPUnit unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Unit suite
        run: composer test:unit

  integration:
    name: PHPUnit integration (wp-env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Set up Node (for @wordpress/env)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Start WordPress (Docker, plugin mapped in and activated)
        run: npx --yes @wordpress/env start --debug

      - name: Enable pretty permalinks
        run: npx --yes @wordpress/env run cli wp rewrite structure '/%postname%/' --hard

      - name: Integration suite
        env:
          WPMCP_TEST_URL: http://localhost:8888
        run: composer test:integration

      - name: WordPress logs (on failure)
        if: failure()
        run: npx --yes @wordpress/env logs all || true

      - name: Stop WordPress
        if: always()
        run: npx --yes @wordpress/env stop || true

  release:
    name: Build, gate, and release
    runs-on: ubuntu-latest
    # The release must be impossible while the suite is red. All three must be
    # green; `needs` treats any failure or cancellation as a blocker, and the whole
    # matrix of phpunit-unit has to pass, not just one leg.
    needs: [lint, phpunit-unit, integration]
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint all plugin files
        run: |
          for f in wp-mcp.php endpoint.php admin.php tools.php; do
            php -l "$f"
          done

      - name: Stage the install set (4 php + LICENSE + README) under wp-mcp/
        run: |
          mkdir -p dist/wp-mcp
          cp wp-mcp.php endpoint.php admin.php tools.php LICENSE README.md dist/wp-mcp/

      - name: Build wp-mcp.zip (top-level wp-mcp/ folder)
        run: |
          cd dist
          zip -r wp-mcp.zip wp-mcp -x '*.bak' '*.log'
          cd ..

      - name: GATE - extracted content matches source, lints clean, bak-count == 3
        run: |
          mkdir -p verify
          unzip -q dist/wp-mcp.zip -d verify
          fail=0
          for f in wp-mcp.php endpoint.php admin.php tools.php LICENSE README.md; do
            if ! cmp -s "$f" "verify/wp-mcp/$f"; then
              echo "MISMATCH: $f differs from the zipped copy"; fail=1
            fi
          done
          for f in wp-mcp.php endpoint.php admin.php tools.php; do
            php -l "verify/wp-mcp/$f" || fail=1
          done
          bak=$(grep -c "wpmcp_bak_ok" verify/wp-mcp/tools.php)
          echo "wpmcp_bak_ok in zip: $bak (expected 3)"
          test "$bak" -eq 3 || fail=1
          if [ "$fail" -ne 0 ]; then echo "GATE FAILED - not releasing"; exit 1; fi
          echo "GATE PASSED"

      - name: Create GitHub Release with the verified zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/wp-mcp.zip \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated release of ${GITHUB_REF_NAME}. Self-hosted WordPress MCP server with short-lived, admin-minted, IP-pinned tokens; read/admin scopes; opt-in jailed theme code editing. See CHANGELOG.md." \
            --verify-tag
