name: Release

# Build + gate + publish the install zip whenever a version tag is pushed.
#   git tag v1.1.0 && git push origin v1.1 --tags
# produces a GitHub Release with a verified wp-mcp.zip attached. See docs/RELEASE.md.
#
# WHAT CHANGED, AND WHAT DID NOT (analysis/53-open-decisions.md, D16 and D17). This
# workflow used to re-run the entire gate on the tag, because ci.yml is triggered by
# push/pull_request and does not run on a tag push - so there was "no run to depend on".
# That reasoning was about the COMMIT. It is the CODE that a test can see: `decide` below
# computes the same fingerprint ci.yml computes and looks for the artifact a green ci.yml
# run seals it with. When one exists, the two WordPress tiers are skipped and this workflow
# goes straight to building and verifying the zip; when none exists, all four gate jobs run
# exactly as they always did. Lint and the unit tier run either way - see below.
#
# WHAT A REUSE MAY AND MAY NOT BUY. It may stand in for the two WordPress tiers, which are
# about the shipped PHP and nothing else. It may NOT stand in for lint or the unit tier:
# those run on every tag, because the fingerprint deliberately does not hash the markdown
# that ships beside the code, and the unit tier is the only thing that tests it.
#
# THE SAFETY PROPERTY IS UNCHANGED IN STRENGTH AND DIFFERENT IN WORDS: it was "we ran the
# suite twice on this code"; it is now "lint and the unit tier are green on THIS commit, and
# a green full run exists for this code and this suite". The `release` job's `if:` is the whole
# proof and it is written out longhand for that reason. Lint and the unit tier must have
# SUCCEEDED, in both cases, outside the branch; the branch is over the two WordPress tiers
# alone - either the reuse is real and both were deliberately skipped, or there is no reuse and
# both succeeded. There is no third branch, and `always()` is confined to that one expression
# so a cancelled or failed job can never read as green.
#
# A TAG THAT IS NOT A RELEASE. The trigger also accepts `citest-*`, and the publish step -
# only the publish step - requires a `v` tag. That is how the two refusals D16 asks for are
# provable without publishing anything: a throwaway tag runs the whole decision and the
# whole gate, and cannot create a release even when it is green.
on:
  push:
    tags:
      - 'v*'
      - 'citest-*'

permissions:
  contents: write   # needed to create the release
  actions: read     # needed to ask whether a green run already exists for this fingerprint

jobs:
  decide:
    name: Fingerprint (is this code already proven?)
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.fp.outputs.code }}
      env: ${{ steps.fp.outputs.env }}
      key: ${{ steps.fp.outputs.key }}
      reuse: ${{ steps.reuse.outputs.reuse }}
      reuse_run_id: ${{ steps.reuse.outputs.run_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute the code and environment fingerprints
        id: fp
        run: |
          set -euo pipefail
          eval "$(bash bin/code-fingerprint.sh HEAD)"
          # An empty fingerprint would make every commit look like every other one, which is
          # the one failure of this mechanism that fails OPEN. Refuse rather than guess.
          test -n "${code:-}" && test -n "${env:-}" && test -n "${key:-}"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "env=$env"   >> "$GITHUB_OUTPUT"
          echo "key=$key"   >> "$GITHUB_OUTPUT"
          echo "code fingerprint: $code"
          echo "env  fingerprint: $env"
          echo "run key:          $key"

      - name: Look for a green full run for exactly this fingerprint
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.fp.outputs.key }}
          SEAL: wpmcp-green-${{ steps.fp.outputs.key }}
          # Same cap as ci.yml, and the same reason - see bin/reusable-green-run.sh.
          MAX_AGE_DAYS: '14'
        run: |
          set -euo pipefail

          # An artifact NAME is not a proof. This repository is public, `ci.yml` has a
          # pull_request trigger, a pull_request run executes the PR's OWN ci.yml, and
          # fork-PR artifacts are stored in the base repository - so a name anyone can write
          # must not be what a release rests on (analysis/58 §3b). The lookup therefore lives
          # in a script that checks the RUN the artifact claims to come from: same
          # repository, `.github/workflows/ci.yml`, conclusion success, inside the age cap,
          # and a head commit whose own fingerprint is this key.
          run_id=$(bash bin/reusable-green-run.sh "${GITHUB_REPOSITORY}" "${KEY}" "${MAX_AGE_DAYS}" || true)

          if [ -n "${run_id:-}" ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            {
              echo "### Reusing a green run instead of re-running the gate"
              echo
              echo "- code fingerprint \`${{ steps.fp.outputs.code }}\`"
              echo "- environment fingerprint \`${{ steps.fp.outputs.env }}\`"
              echo "- green run [${run_id}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id})"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Reusing run ${run_id}::The gate is not re-run: run ${run_id} already proved code fingerprint ${{ steps.fp.outputs.code }}."
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "run_id=" >> "$GITHUB_OUTPUT"
            {
              echo "### No green run on file for this fingerprint - running the whole gate"
              echo
              echo "- looked for artifact \`${SEAL}\`"
              echo "- publishing stays impossible until every gate job below is green"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  lint:
    # ALWAYS, reuse or no reuse, and it does not wait for `decide` - it has nothing to
    # decide. See `phpunit-unit` below for why the two cheap tiers are unconditional here.
    name: PHP lint (8.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: php -l all plugin files
        run: |
          status=0
          for f in wp-mcp.php endpoint.php admin.php tools.php trace.php uninstall.php src/*.php; do
            echo "::group::php -l $f"
            php -l "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Guard - the parse check and the version-first rule are still wired in
        # TWO MARKERS, because the tools make two promises and one count cannot hold
        # both. The first WAS a count of the old backup-path helper, gone with the
        # sibling files it guarded (schema revision 4 - the version table); its subject
        # was never those files but the AUTO-REVERT, which they used to be half of.
        #
        #   wpmcp_php_parse_ok       x3  definition, code-write, code-restore
        #   wpmcp_code_version_current x4  definition, code-write, code-delete,
        #                                code-restore
        #
        # The second is the sprint-8 review's correction: the old guard's third site was
        # code-delete, which the parse-check count does not reach (it deletes rather than
        # writing PHP), so nothing was left guarding "every mutation versions first" -
        # the promise the whole version table exists to keep. A new writer or deleter
        # added without one of the two makes this red, which is the point.
        run: |
          parse=$(grep -c "wpmcp_php_parse_ok" tools.php)
          echo "wpmcp_php_parse_ok occurrences: $parse (expected 3)"
          test "$parse" -eq 3

          versioned=$(grep -c "wpmcp_code_version_current" tools.php)
          echo "wpmcp_code_version_current occurrences: $versioned (expected 4)"
          test "$versioned" -eq 4

  phpunit-unit:
    # ALWAYS, AND THIS IS THE ONE THING A REUSE MUST NOT BUY. The fingerprint deliberately
    # does not hash README.md, CHANGELOG.md, SECURITY.md, ARCHITECTURE.md, BUILD-NOTES.md,
    # LICENSE, docs/*.md or build.txt - none of them is executed on a site - and all of them
    # SHIP in the zip this workflow builds. The unit tier is the only thing that tests them:
    # VersionConsistencyTest ties CHANGELOG.md's top heading to `Version:` and `WPMCP_VER`,
    # FloorConsistencyTest ties the README's requirements table to the declared floor, and
    # BuildStampTest reads docs/RELEASE.md and build.txt.
    #
    # So the reuse branch used to have a hole exactly the width of those files: commit Y =
    # sealed commit X plus a CHANGELOG heading that says 1.2.0 while the header says 1.1.1
    # has X's fingerprint, inherits X's seal, and - before this - published, even though its
    # own ci.yml run was RED on VersionConsistencyTest. Found by review (analysis/58 §1).
    # The tier costs about forty seconds in parallel and it is not skippable.
    name: PHPUnit unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Unit suite
        run: composer test:unit

  integration:
    name: PHPUnit integration (wp-env)
    runs-on: ubuntu-latest
    needs: decide
    if: needs.decide.outputs.reuse != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Set up Node (for @wordpress/env)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Start WordPress (Docker, plugin mapped in and activated)
        run: npx --yes @wordpress/env start --debug

      - name: Enable pretty permalinks
        run: npx --yes @wordpress/env run cli wp rewrite structure '/%postname%/' --hard

      - name: Both suites, once, with the log the gates are read from
        env:
          WPMCP_TEST_URL: http://localhost:8888
          # Without this the fixture harness cannot reach WordPress inside the container,
          # every fixture-bearing test skips, and a skip is green. ci.yml learned this in
          # 8db2a74; release.yml had not.
          WPMCP_WP_ENV: '1'
        run: vendor/bin/phpunit --log-junit junit-all.xml

      - name: Ask PHPUnit which group every test is in
        run: vendor/bin/phpunit --list-tests-xml junit-map.xml

      - name: Sprint gates actually executed - read from that one run
        # Same check as ci.yml, from the same script and the same group list, and it has to
        # be here too whenever the gate actually runs: this workflow is the only thing
        # standing between a red gate and a published release. The list is now ONE file -
        # .github/sprint-gate-groups.txt - so the two copies can no longer drift.
        run: |
          set -euo pipefail
          groups=$(grep -v '^[[:space:]]*#' .github/sprint-gate-groups.txt \
            | tr -d '\r' | grep -v '^[[:space:]]*$' | paste -sd, -)
          echo "gate groups: $groups"
          php bin/ci-group-counts.php \
            --map=junit-map.xml --log=junit-all.xml --groups="$groups"

      - name: A RUNTIME deprecation from this plugin fails the gate
        # THE SAME CHECK ci.yml MAKES, and here for the reason the gate step above is here:
        # this workflow is the only thing standing between a red gate and a published release,
        # so it must not be the weaker of the two. See ci.yml's copy for what the check closes -
        # a deprecation raised at RUNTIME, on a path that exists only against a real WordPress,
        # which neither the developer workstation nor the unit tier can see.
        run: |
          set -uo pipefail

          # THREE SENTINELS, so the shell below can tell apart every way this can end. A bare
          # `|| true` on the eval (which is what the first version had) made "the command never
          # ran" print exactly like "nothing was found" - the failure this whole step exists to
          # prevent, in the step itself.
          npx --yes @wordpress/env run cli wp eval '
            $f = WP_CONTENT_DIR . "/debug.log";
            $n = 0;
            echo "WPMCP-DEBUG-LOG-CONST ", (defined("WP_DEBUG_LOG") && WP_DEBUG_LOG) ? 1 : 0, "\n";
            echo "WPMCP-LOG-PRESENT ", is_file($f) ? 1 : 0, "\n";
            if (is_file($f)) {
              foreach ((array) file($f) as $line) {
                $n++;
                if (stripos($line, "deprecated") !== false) { echo rtrim($line), "\n"; }
              }
            }
            echo "WPMCP-SCANNED ", $n, "\n";
          ' > deprecations.txt 2>&1 || true

          # (1) THE SCAN DID NOT RUN. A container that is down, wp-env re-quoting the PHP, a
          # changed CLI - whatever it was, nothing was read, and this is the state that used to
          # pass silently.
          if ! grep -q '^WPMCP-SCANNED ' deprecations.txt; then
            echo "::error title=The deprecation scan did not run::wp eval produced no sentinel, so"\
                 "NOTHING was read. That is not the same as finding no deprecations, and it is not a"\
                 "pass. Output below."
            cat deprecations.txt
            exit 1
          fi

          scanned=$(sed -n 's/^WPMCP-SCANNED //p' deprecations.txt | tail -1)

          # (2) THE GATE IS BLIND. Without WP_DEBUG_LOG nothing is ever written, so the step could
          # never fail however broken the plugin was. .wp-env.json sets it; if that stops being
          # true, this is where it is noticed.
          if ! grep -q '^WPMCP-DEBUG-LOG-CONST 1$' deprecations.txt; then
            echo "::error title=WP_DEBUG_LOG is off in the container::Nothing is written to a debug"\
                 "log, so this step can never fail and proves nothing. Check .wp-env.json."
            cat deprecations.txt
            exit 1
          fi

          # (3) NOTHING WAS WRITTEN AT ALL. WordPress creates debug.log lazily, so with WP_DEBUG_LOG
          # confirmed on, an absent file means the whole suite produced no PHP diagnostic of any
          # kind. That is a pass, and it says so in its own words rather than in (4)'s.
          if grep -q '^WPMCP-LOG-PRESENT 0$' deprecations.txt; then
            echo "WP_DEBUG_LOG is on and no debug.log exists: the suite wrote no PHP diagnostic at all."
            exit 0
          fi

          # (4) A DEPRECATION FROM THIS PLUGIN.
          if grep -E 'Deprecated:.*wp-mcp' deprecations.txt; then
            echo "::error title=Runtime deprecation in wp-mcp::The lines above were raised by this"\
                 "plugin while the suite ran. Neither the workstation nor the unit tier can see them;"\
                 "this step is the only place they appear."
            exit 1
          fi

          # (5) SCANNED, AND CLEAN. The line count is printed because it is the evidence that (1) is
          # not silently happening: a real log has lines.
          echo "Scanned ${scanned} line(s) of the container's debug.log; no wp-mcp deprecation."
          # Somebody else's, counted and not failed: worth seeing, and not ours to fix.
          echo "deprecation lines from any source: $(grep -c 'Deprecated' deprecations.txt || true)"
      - name: WordPress logs (on failure)
        if: failure()
        # `logs` FOLLOWS the logs by default (--watch defaults to true in @wordpress/env 11.15),
        # so without --watch=false this step never exits: a failed run once sat here for over
        # two hours until it was cancelled. The timeout is the backstop.
        timeout-minutes: 5
        run: npx --yes @wordpress/env logs all --watch=false || true

      - name: Stop WordPress
        if: always()
        run: npx --yes @wordpress/env stop || true

  integration-floor:
    # The declared WordPress floor, executed. Same job as ci.yml's, and in this workflow's
    # `needs:` for the same reason the others are: without it a red floor could not block a
    # publish, and a job that cannot block anything is decoration (analysis/52 §10.2).
    name: PHPUnit integration (floor WP 6.9 / PHP 8.4)
    runs-on: ubuntu-latest
    needs: decide
    if: needs.decide.outputs.reuse != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Set up Node (for @wordpress/env)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Start WordPress at the declared floor
        env:
          # 8.4, NOT 8.2, AND THE 8.2 HERE WAS A REAL HOLE (sprint LOG+FLOOR round 2). Four
          # things name the pair this leg proves - this variable, the `case` below, the job name
          # and the error string - and three of them said 8.4 while this one said 8.2. So the
          # release gate ran the floor on a PHP the README does not claim, and the guard written
          # to catch exactly that went green on it. Left over from 14741eb, which moved the floor
          # and updated ci.yml only. FloorConsistencyTest now pins BOTH workflows.
          WP_ENV_CORE: WordPress/WordPress#6.9
          WP_ENV_PHP_VERSION: '8.4'
        run: npx --yes @wordpress/env start --debug

      - name: Enable pretty permalinks
        run: npx --yes @wordpress/env run cli wp rewrite structure '/%postname%/' --hard

      - name: Confirm this really is the floor, and that the plugin activated on it
        run: |
          set -euo pipefail
          version=$(npx --yes @wordpress/env run cli wp core version | tr -d '\r' | tail -1)
          echo "wp core version: $version"
          case "$version" in
            6.9|6.9.*) echo "The container is at the declared floor." ;;
            *) echo "::error::This leg is supposed to run the declared floor (6.9) and the container says ${version}. WP_ENV_CORE did not take."; exit 1 ;;
          esac
          # AND THE OTHER HALF OF THE PAIR. The README says "WordPress 6.9 on PHP 8.4" and
          # FloorConsistencyTest pins that sentence to WP_ENV_PHP_VERSION - but until now
          # nothing asserted what the CONTAINER actually got - and, since sprint LOG+FLOOR round
          # 2, FloorConsistencyTest pins this `case` as well, in BOTH workflows. It has to be
          # both: a guard that accepts a value the variable no longer sets passes on the very
          # drift it was written for, which is what this one did at 8.2 while its own error
          # string said 8.4. wp-env builds from `wordpress:php8.4` today; if it ever stopped
          # honouring the variable the README sentence would go false with this job still green
          # (analysis/58 §5).
          php_version=$(npx --yes @wordpress/env run cli wp eval 'echo PHP_VERSION;' | tr -d '\r' | tail -1)
          echo "container PHP: $php_version"
          case "$php_version" in
            8.4|8.4.*) echo "The container is on the PHP the README claims this pair is tested at." ;;
            *) echo "::error::This leg claims WordPress 6.9 on PHP 8.4 and the container is on PHP ${php_version}. WP_ENV_PHP_VERSION did not take, and the README sentence is now false."; exit 1 ;;
          esac
          npx --yes @wordpress/env run cli wp plugin list --status=active | tee active.txt
          grep -q 'wp-mcp' active.txt || {
            echo "::error::The plugin is not active on WordPress ${version}. A floor the plugin cannot activate on is not a floor."
            exit 1
          }

      - name: Integration suite on the floor
        env:
          WPMCP_TEST_URL: http://localhost:8888
          WPMCP_WP_ENV: '1'
        run: composer test:integration

      - name: WordPress logs (on failure)
        if: failure()
        timeout-minutes: 5
        run: npx --yes @wordpress/env logs all --watch=false || true

      - name: Stop WordPress
        if: always()
        run: npx --yes @wordpress/env stop || true

  release:
    name: Build, gate, and release
    runs-on: ubuntu-latest
    needs: [decide, lint, phpunit-unit, integration, integration-floor]
    # THE WHOLE SAFETY PROPERTY, LONGHAND. `always()` is here only so that this job is
    # evaluated when the two WordPress tiers were deliberately SKIPPED; every other clause
    # then narrows it back to exactly two legitimate shapes, and nothing else can reach the
    # build. `needs.decide.result` must itself be success, or a broken fingerprint step
    # could leave `reuse` empty and be read as "no reuse, and no gate ran either".
    #
    # LINT AND THE UNIT TIER ARE REQUIRED OUTSIDE THE BRANCH, which is the fix for the one
    # hole review found (analysis/58 §1): they run on every tag, so "success" is the only
    # acceptable result for them whether or not the WordPress tiers were reused. Only
    # `integration` and `integration-floor` carry the skipped/success pairing, because they
    # are the only two a fingerprint can stand in for.
    #
    # Note the bracket spelling: a job id with a hyphen cannot be reached with a dot in a
    # GitHub expression, and `needs.phpunit-unit.result` parses as a SUBTRACTION.
    if: >-
      always()
      && needs.decide.result == 'success'
      && needs.lint.result == 'success'
      && needs['phpunit-unit'].result == 'success'
      && (
        (
          needs.decide.outputs.reuse == 'true'
          && needs.integration.result == 'skipped'
          && needs['integration-floor'].result == 'skipped'
        )
        || (
          needs.decide.outputs.reuse == 'false'
          && needs.integration.result == 'success'
          && needs['integration-floor'].result == 'success'
        )
      )
    steps:
      - uses: actions/checkout@v5

      - name: Say out loud what is standing behind this build
        # NEVER SILENT (D17). A skipped gate that nobody printed is how a gate stops
        # gating, so the reused run id and the fingerprint are in the log and in the run
        # summary before a single file is staged.
        run: |
          {
            echo "### What proved this build"
            echo
            echo "- tag \`${GITHUB_REF_NAME}\`, commit \`${GITHUB_SHA}\`"
            echo "- code fingerprint \`${{ needs.decide.outputs.code }}\`"
            echo "- environment fingerprint \`${{ needs.decide.outputs.env }}\`"
            if [ "${{ needs.decide.outputs.reuse }}" = "true" ]; then
              echo "- gate NOT re-run; reusing green run [${{ needs.decide.outputs.reuse_run_id }}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${{ needs.decide.outputs.reuse_run_id }}) for the same fingerprint"
            else
              echo "- gate re-run in this workflow, and green: lint, unit matrix, integration, integration-floor"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint all plugin files
        run: |
          for f in wp-mcp.php endpoint.php admin.php tools.php trace.php uninstall.php modules.php src/*.php modules/*.php; do
            php -l "$f"
          done

      - name: Stage the install set under wp-mcp/
        # THE WHOLE RUNTIME, and it is longer than it was: trace.php, uninstall.php and
        # src/ arrived after this step was written, and a zip without them installs a
        # plugin that fatals on its first request. The gate below compares the extracted
        # copy against this list, so anything missing here is missing silently.
        #
        # THIS LIST AND bin/code-fingerprint.sh'S CODE LIST ARE THE SAME SET, and
        # tests/unit/CodeFingerprintTest.php holds them to it. A shipped PHP file the
        # fingerprint does not hash could be changed and still inherit somebody else's
        # green run, which is the one way this sprint's speed-up could become unsafe.
        #
        # The documentation ships too, all of it, because README.md links to SECURITY.md,
        # ARCHITECTURE.md, CHANGELOG.md, BUILD-NOTES.md and four files under docs/. A zip
        # carrying only README.md gives a reader six dead links.
        #
        # `cp src/*.php` is flat on purpose, and correct today: both classes sit directly
        # in src/. The autoloader maps WpMcp\A\B to src/A/B.php, so the first nested
        # namespace needs this to become `cp -r src dist/wp-mcp/` and the gate's file list
        # to become a find. There is no nested class to justify that yet.
        #
        # `cp modules/*.php` is flat for a stronger reason: modules.php loads each module by the
        # literal path in wpmcp_module_manifest(), and every one of those is `modules/<name>.php`.
        # A module in a subdirectory would need the manifest to name it, so a `find` here would
        # copy files the plugin does not load - and the gate below would still pass.
        #
        # build.txt IS THE ONE FILE THAT IS NOT COPIED, and it is the one file that must
        # not be: `cp` would put the literal placeholders in the zip and the published
        # release would report its build as `source`, which is what a git checkout says.
        # `git archive` is what performs the export-subst substitution (.gitattributes),
        # so the stamp is taken from there and the gate below checks it separately -
        # every other file is compared byte for byte against the source, and this one
        # cannot be.
        run: |
          mkdir -p dist/wp-mcp/src dist/wp-mcp/modules dist/wp-mcp/docs dist/stamp
          cp wp-mcp.php endpoint.php admin.php tools.php trace.php uninstall.php modules.php dist/wp-mcp/
          cp LICENSE README.md CHANGELOG.md SECURITY.md ARCHITECTURE.md BUILD-NOTES.md dist/wp-mcp/
          cp src/*.php dist/wp-mcp/src/
          cp modules/*.php dist/wp-mcp/modules/
          cp docs/*.md dist/wp-mcp/docs/
          # `-f -` is explicit on purpose: GNU tar on Debian and Ubuntu defaults its
          # archive to stdin, and nothing else does. On another runner image, or with
          # bsdtar, a bare `tar -x` reads a tape device and this step dies saying so.
          git archive --format=tar HEAD build.txt | tar -xf - -C dist/stamp
          cp dist/stamp/build.txt dist/wp-mcp/build.txt

      - name: Build wp-mcp.zip (top-level wp-mcp/ folder)
        run: |
          cd dist
          zip -r wp-mcp.zip wp-mcp -x '*.bak' '*.log'
          cd ..

      - name: GATE - extracted content matches source, lints clean, both guards wired
        run: |
          mkdir -p verify
          unzip -q dist/wp-mcp.zip -d verify
          fail=0
          files="wp-mcp.php endpoint.php admin.php tools.php trace.php uninstall.php modules.php"
          files="$files LICENSE README.md CHANGELOG.md SECURITY.md ARCHITECTURE.md"
          files="$files BUILD-NOTES.md $(ls src/*.php) $(ls modules/*.php) $(ls docs/*.md)"
          for f in $files; do
            if ! cmp -s "$f" "verify/wp-mcp/$f"; then
              echo "MISMATCH: $f differs from the zipped copy"; fail=1
            fi
          done
          # THE BUILD STAMP, WHICH IS CHECKED AND NOT COMPARED. Its whole job is to
          # differ from the source: the source carries git's placeholders and the zip
          # carries this commit. What must hold is that the substitution happened - a
          # zip with a leftover placeholder reports `source` and is indistinguishable
          # from a checkout, which is the confusion the stamp exists to end.
          stamp="verify/wp-mcp/build.txt"
          expected=$(git rev-parse --short HEAD)
          if [ ! -f "$stamp" ]; then
            echo "MISSING: build.txt is not in the zip, so the release reports no build"; fail=1
          elif grep -q 'Format:' "$stamp"; then
            echo "UNSTAMPED: build.txt still carries a git placeholder"; cat "$stamp"; fail=1
          elif ! grep -qx "short=$expected" "$stamp"; then
            echo "WRONG COMMIT: build.txt does not say short=$expected"; cat "$stamp"; fail=1
          else
            echo "build stamp: $(grep -x "short=$expected" "$stamp")"
          fi
          # THE FINGERPRINT, RECORDED BESIDE THE ZIP IT DESCRIBES. It is not re-derived from
          # the extracted copy, because the loop above already proved every shipped file in
          # the zip is byte-identical to the checkout the fingerprint was taken from - a
          # second hash of the same bytes would add a way to be wrong, not a way to be sure.
          # What it adds is the record: a published zip can be traced to the run that proved
          # it, by a number, months later.
          echo "code fingerprint of this build: $(bash bin/code-fingerprint.sh HEAD code)"
          # Every PHP file the plugin loads at runtime is in the zip and parses there.
          for f in wp-mcp.php endpoint.php admin.php tools.php trace.php uninstall.php modules.php $(ls src/*.php) $(ls modules/*.php); do
            php -l "verify/wp-mcp/$f" || fail=1
          done
          # The same two markers the lint job guards, asserted on the EXTRACTED copy:
          # the question here is whether what is about to be published is what was
          # tested.
          parse=$(grep -c "wpmcp_php_parse_ok" verify/wp-mcp/tools.php)
          echo "wpmcp_php_parse_ok in zip: $parse (expected 3)"
          test "$parse" -eq 3 || fail=1
          versioned=$(grep -c "wpmcp_code_version_current" verify/wp-mcp/tools.php)
          echo "wpmcp_code_version_current in zip: $versioned (expected 4)"
          test "$versioned" -eq 4 || fail=1
          if [ "$fail" -ne 0 ]; then echo "GATE FAILED - not releasing"; exit 1; fi
          echo "GATE PASSED"

      - name: A throwaway tag proves the gate and publishes nothing
        if: ${{ !startsWith(github.ref_name, 'v') }}
        run: |
          {
            echo "### No release was created, and that is the point"
            echo
            echo "\`${GITHUB_REF_NAME}\` is not a \`v\` tag, so the publish step below is"
            echo "skipped. Everything above it - the fingerprint decision, the gate or its"
            echo "reuse, the zip and the verification - ran exactly as it would for a real"
            echo "release. This is how the two refusals D16 asks for are proved without"
            echo "publishing anything."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release with the verified zip
        # ONLY a `v` tag publishes. Everything above this line is the gate; this line is the
        # act. A `citest-*` tag reaches here and stops.
        if: ${{ startsWith(github.ref_name, 'v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/wp-mcp.zip \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated release of ${GITHUB_REF_NAME}. Self-hosted WordPress MCP server with short-lived, admin-minted, hashed-at-rest tokens; read/admin scopes; opt-in jailed theme code editing. See CHANGELOG.md." \
            --verify-tag
