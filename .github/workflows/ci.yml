name: CI

# Continuous safety net: lint every push and PR so broken PHP never reaches main, then run
# the test tiers. release.yml gates on job IDS (`lint`, `phpunit-unit`, `integration`,
# `integration-floor`) - and those are ITS OWN jobs, not these; the two workflows are kept
# in step by the shared group list and by this comment, and renaming a job in release.yml
# is what breaks that gate.
#
# WHAT RUNS IS COMPUTED, NOT JUDGED (analysis/53-open-decisions.md, D17). `decide` prints a
# CODE fingerprint over exactly the PHP that ships and an ENV fingerprint over the files
# that decide what the tests are and where they run. When a green run already exists for
# both, the WordPress tiers are skipped and the reuse is printed with the run id it is
# reusing - never silently. The unit tier and the lint job ALWAYS run, docs included,
# because VersionConsistencyTest ties the CHANGELOG's top heading to the version in the
# code and a changelog edit really can fail a test.
on:
  push:
    branches: [main, v1, v1.1, ci-lab]
  pull_request:
    branches: [main]
  schedule:
    # 06:17 UTC every Monday, and the reason is .wp-env.json's `"core": null`: the
    # current-core leg runs against whatever WordPress is current on the day, so a green
    # verdict goes stale without a single commit being made. WordPress ships a minor within
    # days of a security issue, so a week is the longest gap that still catches one inside
    # its own news cycle; it is also well inside the 90-day life of the artifact a green run
    # is filed under, so the seal a reuse depends on is never close to expiring. A
    # scheduled run always runs everything - see `decide`.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      force_full:
        description: 'Run the WordPress tiers even when a green run already exists for this fingerprint'
        type: boolean
        default: false

permissions:
  contents: read
  # `decide` asks the Actions API whether a green run already exists for this fingerprint.
  actions: read

jobs:
  decide:
    # THE ONLY JOB THAT DECIDES ANYTHING, and it is thirty seconds long. Everything below
    # reads its outputs; nothing below re-derives them, so there is one answer per run.
    name: Fingerprint (what has to run)
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.fp.outputs.code }}
      env: ${{ steps.fp.outputs.env }}
      key: ${{ steps.fp.outputs.key }}
      seal: ${{ steps.fp.outputs.seal }}
      reuse: ${{ steps.reuse.outputs.reuse }}
      reuse_run_id: ${{ steps.reuse.outputs.run_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute the code and environment fingerprints
        id: fp
        run: |
          set -euo pipefail
          eval "$(bash bin/code-fingerprint.sh HEAD)"
          # An empty fingerprint would make every commit look like every other one, which is
          # the one failure of this mechanism that fails OPEN. Refuse rather than guess.
          test -n "${code:-}" && test -n "${env:-}" && test -n "${key:-}"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "env=$env"   >> "$GITHUB_OUTPUT"
          echo "key=$key"   >> "$GITHUB_OUTPUT"
          echo "seal=wpmcp-green-$key" >> "$GITHUB_OUTPUT"
          echo "code fingerprint: $code"
          echo "env  fingerprint: $env"
          echo "run key:          $key"

      - name: Is a green full run already on file for this fingerprint?
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.fp.outputs.key }}
          SEAL: ${{ steps.fp.outputs.seal }}
          FORCE: ${{ github.event_name == 'schedule' || inputs.force_full == true }}
          # THE AGE CAP, defended at length in bin/reusable-green-run.sh. Short version: a
          # verdict about `"core": null` means "whatever WordPress was current that day", and
          # GitHub runs the schedule on the DEFAULT branch only, so a release branch's seal is
          # never re-proved. Fourteen days bounds a reused verdict to at most one WordPress
          # generation behind, and it is far longer than the case reuse exists for.
          MAX_AGE_DAYS: '14'
        run: |
          set -euo pipefail

          if [ "$FORCE" = "true" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "run_id=" >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              "FULL RUN FORCED (${GITHUB_EVENT_NAME}). A matching fingerprint says the CODE" \
              "is identical, not the environment - the scheduled run exists to re-prove the" \
              "verdict against whatever WordPress and whatever container image are current" \
              "today, because .wp-env.json pins neither." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A seal is uploaded ONLY by a run in which lint, the unit matrix, the
          # current-core integration leg and the floor leg were all green - see the `seal`
          # job. That is necessary and it is not sufficient.
          # An artifact NAME is not a proof. This repository is public, `ci.yml` has a
          # pull_request trigger, a pull_request run executes the PR's OWN ci.yml, and
          # fork-PR artifacts are stored in the base repository - so a name anyone can write
          # must not be what a release rests on (analysis/58 §3b). The lookup therefore lives
          # in a script that checks the RUN the artifact claims to come from: same
          # repository, `.github/workflows/ci.yml`, conclusion success, inside the age cap,
          # and a head commit whose own fingerprint is this key.
          run_id=$(bash bin/reusable-green-run.sh "${GITHUB_REPOSITORY}" "${KEY}" "${MAX_AGE_DAYS}" || true)

          if [ -n "${run_id:-}" ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            {
              echo "### The WordPress tiers are being SKIPPED, and here is exactly why"
              echo
              echo "- code fingerprint \`${{ steps.fp.outputs.code }}\`"
              echo "- environment fingerprint \`${{ steps.fp.outputs.env }}\`"
              echo "- run key \`${{ steps.fp.outputs.key }}\`"
              echo "- reusing the green verdict of run [${run_id}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id})"
              echo
              echo "Two commits with the same code fingerprint ship byte-identical PHP, so"
              echo "a test cannot tell them apart. The lint job and the unit tier still run."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Reusing run ${run_id}::No WordPress tier for code fingerprint ${{ steps.fp.outputs.code }}; run ${run_id} already proved it."
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "run_id=" >> "$GITHUB_OUTPUT"
            echo "No green run on file for ${SEAL}. Running everything." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  lint:
    # ALWAYS, docs included. It is eight seconds and it is where the drift guards live.
    name: PHP lint (8.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: php -l all plugin files
        run: |
          status=0
          for f in wp-mcp.php endpoint.php admin.php tools.php trace.php uninstall.php src/*.php; do
            echo "::group::php -l $f"
            php -l "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Guard - the parse check and the version-first rule are still wired in
        # TWO MARKERS, because the tools make two promises and one count cannot hold
        # both. The first WAS a count of the old backup-path helper, gone with the
        # sibling files it guarded (schema revision 4 - the version table); its subject
        # was never those files but the AUTO-REVERT, which they used to be half of.
        #
        #   wpmcp_php_parse_ok       x3  definition, code-write, code-restore
        #   wpmcp_code_version_current x4  definition, code-write, code-delete,
        #                                code-restore
        #
        # The second is the sprint-8 review's correction: the old guard's third site was
        # code-delete, which the parse-check count does not reach (it deletes rather than
        # writing PHP), so nothing was left guarding "every mutation versions first" -
        # the promise the whole version table exists to keep. A new writer or deleter
        # added without one of the two makes this red, which is the point.
        run: |
          parse=$(grep -c "wpmcp_php_parse_ok" tools.php)
          echo "wpmcp_php_parse_ok occurrences: $parse (expected 3)"
          test "$parse" -eq 3

          versioned=$(grep -c "wpmcp_code_version_current" tools.php)
          echo "wpmcp_code_version_current occurrences: $versioned (expected 4)"
          test "$versioned" -eq 4

  phpunit-unit:
    # Pure PHP, no WordPress, no Docker. The matrix is the declared support floor
    # (Requires PHP: 8.1) through the current release, so a syntax or behaviour
    # difference across versions shows up here rather than on a user's host.
    #
    # THIS TIER ALWAYS RUNS, even for a documentation-only commit, and it is the reason a
    # docs commit is not exempt from testing: VersionConsistencyTest ties the top `## x.y.z`
    # heading in CHANGELOG.md to `Version:` and `WPMCP_VER`, and FloorConsistencyTest ties
    # the declared WordPress floor to the README and to the job that proves it. Either can
    # go red on an edit that touches no PHP at all. It costs about a second.
    name: PHPUnit unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dev dependencies
        # Dev-only manifest; the plugin itself has no runtime dependencies.
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Unit suite
        # WPMCP_TEST_URL is deliberately absent: this job must pass with no site.
        run: composer test:unit

  integration:
    # Black-box HTTP against a real WordPress. rest_do_request() would skip TLS,
    # Origin, Content-Type and the path-URL route, which is precisely where the
    # transport work lives - so this tier uses a real container over real HTTP.
    #
    # ONE RUN, NOT TWO. Until this sprint this job ran the suite and then re-ran PHPUnit
    # once per closed sprint group to prove no gate had silently skipped: measured on run
    # 35514259397 that was 1 h 35 m 23 s followed by 1 h 38 m 28 s of re-executing the same
    # tests in the same container minutes later. The gates are now read out of the one run's
    # JUnit log - see bin/ci-group-counts.php for how, and why a group map is needed at all.
    name: PHPUnit integration (wp-env)
    runs-on: ubuntu-latest
    needs: decide
    if: needs.decide.outputs.reuse != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Set up Node (for @wordpress/env)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Start WordPress (Docker, plugin mapped in and activated)
        # .wp-env.json maps the checkout as the wp-mcp plugin and activates it, and pins
        # nothing: `"core": null` is wp-env's "latest stable WordPress", so THIS leg is the
        # current-core leg and integration-floor below is the declared-floor leg.
        # ubuntu-latest runners ship Docker, so nothing else is needed.
        #
        # That file also sets WPMCP_ALLOW_INSECURE, and it has to: wp-env publishes
        # plain HTTP on port 8888, and the endpoint refuses every non-HTTPS request
        # before it reads the token. Without the constant the whole integration tier
        # would answer 403 and every identity and transport test would fail for a reason
        # that has nothing to do with the code.
        #
        # Which is also why the HTTPS gate's own two properties are NOT in this tier:
        # a host with no TLS and the gate switched off cannot be asked about either.
        # They live in the infra-trust suite, which fails rather than skips on such a
        # host and is run by hand against production - see phpunit.xml.dist.
        run: npx --yes @wordpress/env start --debug

      - name: Enable pretty permalinks
        # /wp-json/ is a rewrite rule. With WordPress's default "plain" permalinks
        # the REST index is only reachable as /?rest_route=/, and the integration
        # tests (like every real MCP client) request /wp-json/.
        run: npx --yes @wordpress/env run cli wp rewrite structure '/%postname%/' --hard

      - name: Confirm the plugin is active, and say which WordPress this is
        run: |
          npx --yes @wordpress/env run cli wp plugin list --status=active
          npx --yes @wordpress/env run cli wp core version

      - name: Both suites, once, with the log the gates are read from
        env:
          # @wordpress/env publishes the development instance on port 8888 by
          # default; it is plain HTTP, so TLS verification stays off.
          WPMCP_TEST_URL: http://localhost:8888
          # WordPress is inside a Docker container, so a host-side wp-cli.phar
          # --path= cannot see its filesystem. This routes the fixture harness
          # through `npx @wordpress/env run cli wp` instead. Without it every
          # fixture-bearing test skips - and a skip is green.
          WPMCP_WP_ENV: '1'
        # BOTH suites, not just `composer test:integration`, and that is not an accident:
        # the per-group check below has to cover exactly what the old per-group re-runs
        # covered, and those ran `phpunit --group sprint-N` over the whole configuration.
        # Several gate groups (sprint-6 among them) live entirely in the unit tier. The unit
        # suite adds about a second here.
        run: vendor/bin/phpunit --log-junit junit-all.xml

      - name: Ask PHPUnit which group every test is in
        # JUnit XML carries no group attribute, and `--group X --list-tests` is refused
        # outright by PHPUnit 10.5 ("the --group and --list-tests options cannot be
        # combined, --group is ignored"). `--list-tests-xml` is the one form that emits
        # `groups=`, one row per data set, and it executes nothing.
        run: vendor/bin/phpunit --list-tests-xml junit-map.xml

      - name: Sprint gates actually executed - read from that one run
        run: |
          set -euo pipefail
          groups=$(grep -v '^[[:space:]]*#' .github/sprint-gate-groups.txt \
            | tr -d '\r' | grep -v '^[[:space:]]*$' | paste -sd, -)
          echo "gate groups: $groups"
          php bin/ci-group-counts.php \
            --map=junit-map.xml --log=junit-all.xml \
            --groups="$groups" --out=counts-from-log.txt

      - name: Per-group wall clock, from the same log
        # Free measurement, and the input to the next question anybody will ask: is it
        # worth sharding this job into a matrix of groups? That answer needs per-group
        # durations, which the log already has and nobody had ever read.
        if: always()
        run: |
          php -r '
            $x = simplexml_load_file("junit-all.xml");
            $rows = [];
            foreach ($x->xpath("//testsuite[@file]") as $s) {
              $rows[(string) $s["name"]] = (float) $s["time"];
            }
            arsort($rows);
            $total = array_sum($rows);
            printf("%-58s %9s\n", "class", "seconds");
            foreach ($rows as $n => $t) { printf("%-58s %9.1f\n", $n, $t); }
            printf("%-58s %9.1f\n", "TOTAL", $total);
          ' || true

      - name: Upload the run log and the counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-log-${{ github.run_attempt }}
          path: |
            junit-all.xml
            junit-map.xml
            counts-from-log.txt
          retention-days: 14
          if-no-files-found: warn

      - name: WordPress logs (on failure)
        if: failure()
        # `logs` FOLLOWS the logs by default (--watch defaults to true in @wordpress/env 11.15),
        # so without --watch=false this step never exits: a failed run once sat here for over
        # two hours until it was cancelled. The timeout is the backstop.
        timeout-minutes: 5
        run: npx --yes @wordpress/env logs all --watch=false || true

      - name: Stop WordPress
        if: always()
        run: npx --yes @wordpress/env stop || true

  integration-floor:
    # THE DECLARED FLOOR, EXECUTED (analysis/53-open-decisions.md, D2; analysis/52 §10).
    # `Requires at least:` is not a hint - core's validate_plugin_requirements() refuses
    # ACTIVATION below it - and until this job existed the number in the header had never
    # been run: .wp-env.json pins `"core": null`, so the only WordPress ever tested was
    # whatever was current on the day.
    #
    # A SEPARATE JOB, NOT A MATRIX LEG on `integration`. A matrix renames the job to
    # "PHPUnit integration (wp-env) (…)", and release.yml gates on job ids of its own
    # copies; the scout that measured this (analysis/52 §10.2) names the rename as the way
    # to break the release gate without noticing.
    #
    # PHP 8.2, NOT 8.3, and that pairing is stated in the README beside the requirement:
    # WordPress 6.4 shipped in November 2023, the same month as PHP 8.3, and declaring a
    # combination nobody can execute is the exact mistake the old "5.5 + PHP 8.1" claim
    # made. WP_ENV_PHP_VERSION sets the container's PHP; the 8.2 above is the runner's,
    # which only runs PHPUnit and Guzzle.
    #
    # NO per-group step here, deliberately. "Did every gate group run" is a property of the
    # test suite, which the current-core leg already proves; asking it twice would add
    # another 1 h 38 m for nothing (analysis/52 §10.3).
    name: PHPUnit integration (floor WP 6.4 / PHP 8.2)
    runs-on: ubuntu-latest
    needs: decide
    if: needs.decide.outputs.reuse != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Set up Node (for @wordpress/env)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Start WordPress at the declared floor
        env:
          # wp-env reads both of these from the environment and they override
          # .wp-env.json, so this job sets the floor and .wp-env.json keeps saying
          # "current" for the leg above. The tag is the bare `6.4` in WordPress/WordPress,
          # which is 6.4.0 - the oldest release the header claims, and therefore the one
          # worth executing.
          WP_ENV_CORE: WordPress/WordPress#6.4
          WP_ENV_PHP_VERSION: '8.2'
        run: npx --yes @wordpress/env start --debug

      - name: Enable pretty permalinks
        run: npx --yes @wordpress/env run cli wp rewrite structure '/%postname%/' --hard

      - name: Confirm this really is the floor, and that the plugin activated on it
        # THE FIRST ASSERTION OF THIS JOB, and the one that makes the rest mean anything: a
        # WP_ENV_CORE that wp-env quietly ignored would leave this leg testing current core
        # twice and reporting a floor it never touched.
        run: |
          set -euo pipefail
          version=$(npx --yes @wordpress/env run cli wp core version | tr -d '\r' | tail -1)
          echo "wp core version: $version"
          case "$version" in
            6.4|6.4.*) echo "The container is at the declared floor." ;;
            *) echo "::error::This leg is supposed to run the declared floor (6.4) and the container says ${version}. WP_ENV_CORE did not take."; exit 1 ;;
          esac
          # AND THE OTHER HALF OF THE PAIR. The README says "WordPress 6.4 on PHP 8.2" and
          # FloorConsistencyTest pins that sentence to WP_ENV_PHP_VERSION - but until now
          # nothing asserted what the CONTAINER actually got. wp-env builds from
          # `wordpress:php8.2` today; if it ever stopped honouring the variable the README
          # sentence would go false with this job still green (analysis/58 §5).
          php_version=$(npx --yes @wordpress/env run cli wp eval 'echo PHP_VERSION;' | tr -d '\r' | tail -1)
          echo "container PHP: $php_version"
          case "$php_version" in
            8.2|8.2.*) echo "The container is on the PHP the README claims this pair is tested at." ;;
            *) echo "::error::This leg claims WordPress 6.4 on PHP 8.2 and the container is on PHP ${php_version}. WP_ENV_PHP_VERSION did not take, and the README sentence is now false."; exit 1 ;;
          esac
          npx --yes @wordpress/env run cli wp plugin list --status=active | tee active.txt
          grep -q 'wp-mcp' active.txt || {
            echo "::error::The plugin is not active on WordPress ${version}. A floor the plugin cannot activate on is not a floor."
            exit 1
          }

      - name: Integration suite on the floor
        env:
          WPMCP_TEST_URL: http://localhost:8888
          WPMCP_WP_ENV: '1'
        run: composer test:integration

      - name: WordPress logs (on failure)
        if: failure()
        timeout-minutes: 5
        run: npx --yes @wordpress/env logs all --watch=false || true

      - name: Stop WordPress
        if: always()
        run: npx --yes @wordpress/env stop || true

  seal:
    # HALF OF WHAT MAKES A REUSE HONEST, and only half. This job uploads an artifact whose
    # NAME is the run key, and it can only run when every tier above was green - `needs`
    # without `always()` refuses to start otherwise, and a skipped dependency skips it too.
    # So the artifact's existence is NECESSARY for "a green lint, unit matrix, current-core
    # integration leg and floor leg exist for this exact code and this exact suite".
    #
    # IT IS NOT SUFFICIENT, because a name is not a proof: this repository is public and a
    # pull request runs its own copy of this file. The artifact is a POINTER, and
    # bin/reusable-green-run.sh is what turns it into a statement - it checks the run behind
    # the name (same repository, this workflow, conclusion success, inside the age cap, and a
    # head commit whose own fingerprint is this key) before either workflow reuses anything.
    #
    # It does not run on a reused verdict (reuse == 'true'), because the seal it would
    # write is the seal it just read: a run that executed no WordPress tier must not be
    # able to vouch for one.
    name: Seal this fingerprint as proven
    runs-on: ubuntu-latest
    needs: [decide, lint, phpunit-unit, integration, integration-floor]
    if: needs.decide.outputs.reuse == 'false'
    steps:
      - name: Write what was proven
        run: |
          mkdir -p seal
          {
            echo "code=${{ needs.decide.outputs.code }}"
            echo "env=${{ needs.decide.outputs.env }}"
            echo "key=${{ needs.decide.outputs.key }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "commit=${{ github.sha }}"
            echo "ref=${{ github.ref }}"
            echo "proved=lint,phpunit-unit,integration,integration-floor"
          } > "seal/${{ needs.decide.outputs.key }}.txt"
          cat "seal/${{ needs.decide.outputs.key }}.txt"

      - name: Upload the seal
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.decide.outputs.seal }}
          path: seal/
          # The retention is the real lifetime of a reusable verdict. 90 days is the
          # maximum for a public repository, and the Monday schedule above re-proves the
          # branch long before anything approaches it.
          retention-days: 90
